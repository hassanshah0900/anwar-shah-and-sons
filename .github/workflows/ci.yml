name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only reads the code, so its GitHub token gets no write access.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Runs on main always finish, so every merge gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
